name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin
        run: |
          node --check main.js
          node -e 'const m=require("./manifest.json");if(m.id!=="obsidian-smart-fold"||!/^\d+\.\d+\.\d+$/.test(m.version))process.exit(1)'
      - name: Create draft with installable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./manifest.json").version')
          gh release create "$version" main.js manifest.json --draft --target "$GITHUB_SHA" --title "$version" --notes-file CHANGELOG.md
